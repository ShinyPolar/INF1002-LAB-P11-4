<!doctype html>

<html>
<head>
    <title>Phishing Email Detector</title>
    <style>
        .analysis-box{
            display: flex;
            /*align-items: center;*/
            flex-direction: column;
            justify-content: center;
            height: 20vh;
            color: red;
            align-items:center;
        }

        .analysis-display{
            width: 20%;
            text-align: left;
            margin: 5px 0;
        }

        .display-emails {
            display: flex;
            gap: 20px;                /* space between boxes */
            height: 70vh;
            background: #f0f0f0;
        }

        .display-box{
            flex: 1;                /* make both boxes equal width */
            display: flex;
            flex-direction: column; /* stack title and content vertically */
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            background: #f9f9f9;
        }

        .single-email-display {
            flex: 1;  
            overflow-y: auto;
        }
    </style>
    </head>
    <body>
        <h1>Phishing Email Detector</h1>
        <div class="analysis-box">
            <h1 class = "analysis-display">RISK SCORE: {{riskScore}}</h1>
            <p class = "analysis-display">By Whitelisted Domain Check: {{riskScoreWhitelistDomain}}</p>
            <p class = "analysis-display">By Edit Distance Check: {{riskScoreDistanceCheck}}</p>
            <p class = "analysis-display">By Keyword Check: {{riskScoreKeyword}}</p>
            <p class = "analysis-display">By URL Check: {{riskScoreURL}}</p>


        </div>
        <div class="display-emails">
            <div class="display-box">
            <h4>Plain Text</h4>
            <div class="single-email-display">
                <pre style="white-space:pre-wrap; word-wrap:break-word;">{{plainText | safe}}</pre>

            </div>
            </div>
            <div class="display-box">
            <h4>HTML Text</h4>
            <div class="single-email-display">
                <pre style="white-space:pre-wrap; word-wrap:break-word;">{{htmlText | safe}}</pre>

            </div>
            </div>
        </div>
    </body>
</html>
